<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaNa Fischquiz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<style>
:root{
  --bg1:#0b4f6c; --bg2:#01baef; --card:#ffffff; --ink:#12263a; --muted:#5b7083;
  --ok:#22a06b; --okbg:#e3f7ec; --bad:#d64545; --badbg:#fde8e8; --accent:#ff9f1c;
  --opt:#f2f7fb; --optb:#d5e3ee; --shadow:0 10px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#031926; --bg2:#0b4f6c; --card:#10283a; --ink:#e8f1f8; --muted:#9db3c4;
    --okbg:#123d2a; --badbg:#432020; --opt:#163448; --optb:#24506b;
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(170deg,var(--bg1),var(--bg2));background-attachment:fixed;padding:16px;}
.wrap{max-width:680px;margin:0 auto}
header{color:#fff;text-align:center;margin:8px 0 18px}
header h1{margin:0;font-size:1.8rem;letter-spacing:.5px}
header p{margin:4px 0 0;opacity:.85}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
button{font:inherit;cursor:pointer;border:none;border-radius:14px}
.big{display:block;width:100%;padding:16px;margin:10px 0;font-size:1.1rem;font-weight:700;color:#fff;background:var(--accent);box-shadow:0 4px 0 #c97600;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #c97600}
.big.blue{background:#1b8bd1;box-shadow:0 4px 0 #11608f}
.big.gray{background:#6b8295;box-shadow:0 4px 0 #485a69}
.big:disabled{opacity:.4;cursor:default}
input[type=text]{width:100%;padding:14px;font-size:1.1rem;border-radius:12px;border:2px solid var(--optb);background:var(--opt);color:var(--ink)}
label{font-weight:600;display:block;margin-bottom:6px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:700;background:var(--opt);border:1px solid var(--optb)}
.stats{display:flex;gap:10px;font-weight:700}
.progress{height:12px;background:var(--opt);border-radius:999px;overflow:hidden;margin:6px 0 16px}
.progress div{height:100%;background:linear-gradient(90deg,#ffd166,var(--accent));transition:width .3s}
.qnum{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.question{font-size:1.25rem;font-weight:700;line-height:1.35;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;margin:10px 0;background:var(--opt);border:2px solid var(--optb);color:var(--ink);font-size:1.02rem;line-height:1.35}
.opt .key{flex:0 0 28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--optb);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt:hover:not(:disabled){border-color:#1b8bd1}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.feedback{margin-top:12px;padding:14px;border-radius:14px;font-weight:600;display:none}
.feedback.ok{display:block;background:var(--okbg);border-left:6px solid var(--ok)}
.feedback.bad{display:block;background:var(--badbg);border-left:6px solid var(--bad)}
.feedback small{display:block;font-weight:400;margin-top:6px;color:var(--ink)}
.result-big{text-align:center;font-size:3.2rem;margin:4px 0}
.rank{text-align:center;font-size:1.4rem;font-weight:800;margin:0}
.score{text-align:center;color:var(--muted);margin:6px 0 16px}
table{width:100%;border-collapse:collapse;margin:8px 0 16px}
td{padding:8px 4px;border-bottom:1px solid var(--optb)}
td:last-child{text-align:right;font-weight:700}
.bar{height:8px;background:var(--opt);border-radius:999px;overflow:hidden;margin-top:4px}
.bar div{height:100%;background:var(--ok)}
.wrong{padding:12px;border-radius:12px;background:var(--opt);margin:8px 0;font-size:.95rem}
.wrong b{display:block;margin-bottom:4px}
.wrong .r{color:var(--ok);font-weight:700}
.wrong .y{color:var(--bad);text-decoration:line-through}
h2{margin:18px 0 8px;font-size:1.15rem}
.hs li{margin:4px 0}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px}.row>*{flex:1}
.splash{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1.4s ease-out forwards;z-index:9}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(var(--r))}}
.pic{margin:0 0 14px;text-align:center}
.pic img{max-width:100%;max-height:240px;border-radius:12px;background:#fff;display:block;margin:0 auto}
.pic .src{display:block;font-size:.72rem;color:var(--muted);margin-top:6px;text-decoration:none}
.pic.loading{height:170px;border-radius:12px;background:var(--opt);animation:pulse .9s infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.hidden{display:none}
footer{color:#fff;opacity:.7;text-align:center;font-size:.8rem;margin:18px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎣 SaNa Fischquiz</h1>
    <p>Fit für den Sachkundenachweis Fischerei</p>
  </header>

  <!-- START -->
  <section id="start" class="card">
    <label for="name">Wer spielt?</label>
    <input id="name" type="text" placeholder="Dein Name" maxlength="20" autocomplete="off">
    <button class="big" data-n="50">🏆 Prüfung – 50 Fragen</button>
    <button class="big blue" data-n="20">⚡ Schnellrunde – 20 Fragen</button>
    <button class="big gray" id="retryBtn">🔁 Meine Fehler üben</button>
    <p class="muted" id="poolInfo"></p>
    <h2>🥇 Bestenliste</h2>
    <ol class="hs" id="hs"></ol>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="card hidden">
    <div class="topbar">
      <span class="chip" id="cat"></span>
      <span class="stats"><span id="fish">🐟 0</span><span id="streak"></span></span>
    </div>
    <div class="progress"><div id="prog"></div></div>
    <div class="qnum" id="qnum"></div>
    <div class="pic hidden" id="pic"></div>
    <p class="question" id="q"></p>
    <div id="opts"></div>
    <div class="feedback" id="fb"></div>
    <button class="big hidden" id="next">Weiter ➜</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="card hidden">
    <div class="result-big" id="rEmoji"></div>
    <p class="rank" id="rRank"></p>
    <p class="score" id="rScore"></p>
    <h2>Nach Themen</h2>
    <table id="rCats"></table>
    <div id="rWrongWrap">
      <h2>Das üben wir nochmal</h2>
      <div id="rWrong"></div>
    </div>
    <div class="row">
      <button class="big" id="again">Nochmal 🎣</button>
      <button class="big gray" id="home">Start</button>
    </div>
  </section>

  <footer>Alle 150 Fragen aus dem SaNa-Prüfungskatalog · Tasten 1/2/3 und Enter funktionieren auch</footer>
</div>

<script>

// [Kategorie, Nr, Frage, [richtig, falsch, falsch], Tipp]

["A",8,"Bestimme den Fisch: langer, marmorierter Grundfisch mit einem Bartfaden am Kinn und zwei Rückenflossen.",["Trüsche","Wels","Aal"],"Die Trüsche ist der einzige Dorschverwandte im Süsswasser."],

const okLicense = l => /public domain|cc0|^pd/i.test(l||"");
const stripTags = s => {const d=document.createElement("div");d.innerHTML=s||"";return d.textContent.trim()};

// Strenge Suche: Artname muss im Dateinamen stehen, historische Bestimmungstafeln (Bloch u.a.) zuerst,
// nur Public Domain / CC0, nur deutlich längliche Bilder (Fisch von der Seite statt Schwarm/Aquarium).
const BAD_WORDS=/aquarium|school|schwarm|shoal|market|markt|fillet|filet|dish|food|skelet|skull|scale|egg|larva|fry|map|karte|stamp|briefmarke|coin|underwater|diver|plate_\d+_\d+/i;
let banned=(()=>{try{return JSON.parse(localStorage.getItem("sana_img_banned"))||[]}catch(e){return []}})();
async function searchCommons(query){
  const p = new URLSearchParams({action:"query",format:"json",origin:"*",generator:"search",gsrnamespace:"6",gsrlimit:"30",
    gsrsearch: query+" filetype:bitmap", prop:"imageinfo", iiprop:"url|size|extmetadata", iiurlwidth:"640",
    iiextmetadatafilter:"LicenseShortName|Artist"});
  const r = await fetch("https://commons.wikimedia.org/w/api.php?"+p);
  const j = await r.json();
  const pages = Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index);
  const out=[];
  for(const pg of pages){
    const ii=(pg.imageinfo||[])[0]; if(!ii) continue;
    const lic=stripTags(ii.extmetadata?.LicenseShortName?.value);
    if(!okLicense(lic)) continue;
    if(BAD_WORDS.test(pg.title)) continue;
    if(ii.width < 300 || ii.width < ii.height*1.5) continue; // Fisch seitlich = breites Bild
    out.push({url:ii.thumburl||ii.url, page:ii.descriptionurl, lic, artist:stripTags(ii.extmetadata?.Artist?.value).slice(0,60)});
  }
  return out;
}
function findImage(n){
  if(!IMG[n]) return Promise.resolve(null);
  if(imgStore[n] && !banned.includes(imgStore[n].url)) return Promise.resolve(imgStore[n]);
  if(imgMem[n]) return imgMem[n];
  imgMem[n]=(async()=>{
    for(const t of IMG[n]){
      for(const q of [`intitle:"${t}" Bloch`,`intitle:"${t}" (illustration OR drawing OR plate OR Tafel)`,`intitle:"${t}"`]){
        try{
          const im=(await searchCommons(q)).find(c=>!banned.includes(c.url));
          if(im){imgStore[n]=im;try{localStorage.setItem(IMG_CACHE_KEY,JSON.stringify(imgStore))}catch(e){};return im}
        }catch(e){}
      }
    }
    return null;
  })();
  return imgMem[n];
}
function banImage(n,url){
  banned.push(url);try{localStorage.setItem("sana_img_banned",JSON.stringify(banned))}catch(e){}
  delete imgStore[n];delete imgMem[n];try{localStorage.setItem(IMG_CACHE_KEY,JSON.stringify(imgStore))}catch(e){}
}

  let chosen=[],rest=[];
  cats.forEach(c=>{const s=shuffle(byCat[c]);chosen.push(...s.slice(0,min));rest.push(...s.slice(min))});
  chosen.push(...shuffle(rest).slice(0,n-chosen.length));
  return shuffle(chosen);
}

function show(id){["start","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}

function start(n,m="normal"){
  player=$("name").value.trim()||"Anonym"; store.set("sana_name",player);
  mode=m; lastN=n;
  if(m==="retry"){
    const w=store.get("sana_wrong_"+player,[]);
    round=shuffle(Q.filter(q=>w.includes(q[1])));
  } else round=pickQuestions(n);
  if(!round.length)return;
  idx=0;correct=0;streak=0;best=0;wrongs=[];
  show("quiz");render();
}

function render(){
  answered=false;
  const q=round[idx],c=CATS[q[0]];
  $("cat").textContent=c.icon+" "+c.name;
  $("qnum").textContent="Frage "+(idx+1)+" von "+round.length+" · Nr. "+q[1];
  $("prog").style.width=(idx/round.length*100)+"%";
  $("fish").textContent="🐟 "+correct;
  $("streak").textContent=streak>=3?"🔥 "+streak:"";
  $("q").textContent=q[2];
  picShown=false;
  const pic=$("pic");
  if(SVG[q[1]]){
    pic.className="pic";pic.innerHTML=SVG[q[1]];
    pic.firstChild.style.cssText="width:100%;max-height:220px;border-radius:12px;display:block";
    picShown=true;$("q").textContent="Welcher Kunstköder ist hier abgebildet?";
  } else if(IMG[q[1]]){
    loadPic(q);
  } else {pic.className="pic hidden";pic.innerHTML=""}
  if(round[idx+1]) findImage(round[idx+1][1]); // nächstes Bild vorladen
  const opts=shuffle(q[3].map((t,i)=>({t,ok:i===0})));
  $("opts").innerHTML="";
  opts.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="opt";b.dataset.ok=o.ok?"1":"";
    b.innerHTML='<span class="key">'+(i+1)+'</span><span></span>';
    b.lastChild.textContent=o.t;
    b.onclick=()=>answer(b);
    $("opts").appendChild(b);
  });
  $("fb").className="feedback";$("fb").innerHTML="";
  $("next").classList.add("hidden");
}

function loadPic(q){
  const pic=$("pic");
  pic.className="pic loading";pic.innerHTML="";
  findImage(q[1]).then(im=>{
    if(round[idx]!==q) return;
    if(!im){pic.className="pic hidden";picShown=false;if(!answered)$("q").textContent=q[2];return}
    pic.className="pic";pic.innerHTML="";
    const img=new Image();img.alt="";img.src=im.url;
    img.onerror=()=>{banImage(q[1],im.url);loadPic(q)};
    const a=document.createElement("a");a.className="src";a.href=im.page;a.target="_blank";a.rel="noopener";
    a.textContent="Bild: Wikimedia Commons · "+im.lic+(im.artist?" · "+im.artist:"");
    const bad=document.createElement("button");bad.className="src";bad.type="button";
    bad.style.cssText="background:none;margin:4px auto 0;text-decoration:underline;cursor:pointer";
    bad.textContent="👎 Bild passt nicht – anderes zeigen";
    bad.onclick=()=>{banImage(q[1],im.url);loadPic(q)};
    pic.append(img,a,bad);
    if(!answered){picShown=true;$("q").textContent=q[1]<=17?"Bestimme diesen Fisch.":"Was ist hier abgebildet?"}
  });
}

const praise=["Super! 🎉","Volltreffer! 🎯","Petri Heil! 🎣","Genau! 💪","Richtig! 🐟","Mega! ⭐"];
function answer(btn){
  if(answered)return;answered=true;
  const q=round[idx],ok=btn.dataset.ok==="1";
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.dataset.ok)b.classList.add("ok")});
  if(ok){correct++;streak++;best=Math.max(best,streak);splash(btn,streak>=5?"🔥":"🐟")}
  else{btn.classList.add("bad");streak=0;wrongs.push({q,chosen:btn.lastChild.textContent})}
  const fb=$("fb");
  fb.className="feedback "+(ok?"ok":"bad");
  fb.innerHTML=ok?praise[Math.floor(Math.random()*praise.length)]:"Leider nicht. Richtig ist: <br>"+esc(q[3][0]);
  if(picShown&&q[1]<=17){const s=document.createElement("small");s.textContent="🔍 Merkmale: "+q[2];fb.appendChild(s)}
  if(q[4]){const s=document.createElement("small");s.textContent="💡 "+q[4];fb.appendChild(s)}
  $("fish").textContent="🐟 "+correct;
  $("streak").textContent=streak>=3?"🔥 "+streak:"";
  $("next").textContent=idx===round.length-1?"Auswertung 🏁":"Weiter ➜";
  $("next").classList.remove("hidden");$("next").focus({preventScroll:true});
}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

function splash(el,emoji){
  const r=el.getBoundingClientRect();
  for(let i=0;i<6;i++){
    const s=document.createElement("div");s.className="splash";s.textContent=emoji;
    s.style.left=(r.left+r.width/2)+"px";s.style.top=(r.top)+"px";
    s.style.setProperty("--dx",(Math.random()*240-120)+"px");
    s.style.setProperty("--dy",(-60-Math.random()*140)+"px");
    s.style.setProperty("--r",(Math.random()*120-60)+"deg");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1500);
  }
}

function next(){idx++;if(idx<round.length)render();else finish()}

function finish(){
  $("prog").style.width="100%";
  const pct=Math.round(correct/round.length*100);
  const ranks=[[95,"🏆","Hecht des Sees – Prüfungsreif!"],[80,"🐟","Stolze Seeforelle"],[65,"🐠","Flinker Egli"],[45,"🐡","Sömmerling – weiter üben!"],[0,"🥚","Fischei – das wird noch!"]];
  const r=ranks.find(x=>pct>=x[0]);
  $("rEmoji").textContent=r[1];$("rRank").textContent=r[2];
  $("rScore").textContent=correct+" von "+round.length+" richtig ("+pct+" %) · beste Serie "+best;
  // Kategorien
  const stat={};round.forEach(q=>{stat[q[0]]=stat[q[0]]||{n:0,ok:0};stat[q[0]].n++});
  round.forEach(q=>{if(!wrongs.some(w=>w.q===q))stat[q[0]].ok++});
  $("rCats").innerHTML=Object.keys(CATS).filter(c=>stat[c]).map(c=>{
    const s=stat[c],p=Math.round(s.ok/s.n*100);
    return '<tr><td>'+CATS[c].icon+' '+CATS[c].name+'<div class="bar"><div style="width:'+p+'%"></div></div></td><td>'+s.ok+'/'+s.n+'</td></tr>'}).join("");
  // Fehler
  $("rWrongWrap").classList.toggle("hidden",!wrongs.length);
  $("rWrong").innerHTML=wrongs.map(w=>'<div class="wrong"><b>'+w.q[1]+'. '+esc(w.q[2])+'</b><span class="y">'+esc(w.chosen)+'</span><br><span class="r">✓ '+esc(w.q[3][0])+'</span></div>').join("");
  // Fehlerliste speichern
  let wl=store.get("sana_wrong_"+player,[]);
  round.forEach(q=>{wl=wl.filter(n=>n!==q[1])});
  wrongs.forEach(w=>wl.push(w.q[1]));
  store.set("sana_wrong_"+player,[...new Set(wl)]);
  // Bestenliste
  if(mode==="normal"){
    const hs=store.get("sana_hs",[]);
    hs.push({name:player,pct,n:round.length,d:new Date().toLocaleDateString("de-CH")});
    hs.sort((a,b)=>b.pct-a.pct||b.n-a.n);store.set("sana_hs",hs.slice(0,10));
  }
  show("result");
  if(pct>=80)for(let i=0;i<4;i++)setTimeout(()=>splash($("rEmoji"),["🎉","🐟","⭐","🎣"][i]),i*250);
}

function home(){
  const hs=store.get("sana_hs",[]);
  $("hs").innerHTML=hs.length?hs.map(h=>'<li><b>'+esc(h.name)+'</b> – '+h.pct+' % <span class="muted">('+h.n+' Fragen, '+h.d+')</span></li>').join(""):'<li class="muted">Noch keine Runden gespielt.</li>';
  const name=$("name").value.trim()||"Anonym";
  const w=store.get("sana_wrong_"+name,[]);
  $("retryBtn").disabled=!w.length;
  $("retryBtn").textContent="🔁 Meine Fehler üben"+(w.length?" ("+w.length+")":"");
  $("poolInfo").textContent=Q.length+" Fragen im Pool, jedes Thema kommt in jeder Runde vor.";
  show("start");
}

document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>start(+b.dataset.n));
$("retryBtn").onclick=()=>start(0,"retry");
$("next").onclick=next;
$("again").onclick=()=>start(lastN,mode);
$("home").onclick=home;
$("name").addEventListener("input",home);
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden"))return;
  if(!answered&&["1","2","3"].includes(e.key)){const b=$("opts").children[+e.key-1];if(b)answer(b)}
  else if(answered&&e.key==="Enter"){e.preventDefault();next()}
});
$("name").value=store.get("sana_name","");
home();
</script>
</body>
</html>
